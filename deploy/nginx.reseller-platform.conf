# Production nginx configuration for altivoxai.com.
# This file is included from nginx's http{} context via sites-enabled.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Shared per-client-IP zones. When Cloudflare is enabled, only activate its real-IP config after
# the origin firewall accepts HTTP(S) exclusively from Cloudflare; otherwise the header is spoofable.
limit_req_zone  $binary_remote_addr zone=altivox_web:10m     rate=20r/s;
limit_req_zone  $binary_remote_addr zone=altivox_api:20m     rate=15r/s;
limit_req_zone  $binary_remote_addr zone=altivox_auth:10m    rate=1r/s;
limit_req_zone  $binary_remote_addr zone=altivox_upload:10m  rate=2r/s;
limit_req_zone  $binary_remote_addr zone=altivox_webhook:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=altivox_internal:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=altivox_conn:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
server_tokens off;

# Redirect all clear-text requests before they reach the application.
server {
  listen 80;
  server_name altivoxai.com www.altivoxai.com api.altivoxai.com;
  client_header_timeout 10s;
  client_body_timeout 10s;
  return 301 https://$host$request_uri;
}

# Frontend: altivoxai.com
server {
  listen 443 ssl http2;
  server_name altivoxai.com www.altivoxai.com;

  ssl_certificate /etc/letsencrypt/live/altivoxai.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/altivoxai.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 128k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  keepalive_timeout 15s;
  keepalive_requests 200;
  send_timeout 20s;
  reset_timedout_connection on;
  limit_conn altivox_conn 30;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.altivoxai.com wss://api.altivoxai.com; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; upgrade-insecure-requests" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  root /opt/reseller-platform/apps/web/dist;
  index index.html;

  # Hashed Vite assets are immutable. Missing assets must return a real 404 instead of
  # falling through to index.html (HTML-as-CSS causes a blank application).
  location ^~ /assets/ {
    limit_req zone=altivox_web burst=60 nodelay;
    try_files $uri =404;
    access_log off;
    expires 1y;
  }

  # The SPA shell points to hashed assets and must always be revalidated after a deploy.
  location = /index.html {
    limit_req zone=altivox_web burst=60 nodelay;
    try_files /index.html =404;
    expires -1;
  }

  location / {
    limit_req zone=altivox_web burst=60 nodelay;
    try_files $uri $uri/ /index.html;
  }

  # Telegram Mini App route — Telegram-friendly CSP so telegram-web-app.js can load,
  # Google Fonts render, and Telegram Web (iframe) can embed the page. X-Frame-Options
  # DENY is intentionally NOT emitted here (frame-ancestors in CSP replaces it).
  #
  # Fallback goes to the named location @mini_app_index, NOT to /index.html directly,
  # so the SPA fallback does not re-enter `location /` (which would re-apply the strict
  # CSP + X-Frame-Options DENY and defeat this whole block).
  location ^~ /mini-app/ {
    limit_req zone=altivox_web burst=60 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.altivoxai.com wss://api.altivoxai.com https://telegram.org; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org https://telegram.org; img-src 'self' data: https:; object-src 'none'; script-src 'self' 'sha256-swE1TVDfuQzRhMHXI+LFLPUl65l7f/GD+i0nRNnPdBU=' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    try_files $uri $uri/ @mini_app_index;
  }

  # Named SPA fallback for /mini-app/*. Serves index.html directly and re-emits the
  # Telegram-friendly headers (add_header does not inherit across location boundaries).
  location @mini_app_index {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.altivoxai.com wss://api.altivoxai.com https://telegram.org; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org https://telegram.org; img-src 'self' data: https:; object-src 'none'; script-src 'self' 'sha256-swE1TVDfuQzRhMHXI+LFLPUl65l7f/GD+i0nRNnPdBU=' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    try_files /index.html =404;
  }

  # User uploads are isolated with a sandbox CSP. This prevents an uploaded HTML/SVG file from
  # executing with dashboard-origin privileges while preserving normal image/video rendering.
  location /uploads/ {
    alias /opt/reseller-platform/uploads/;
    limit_req zone=altivox_web burst=60 nodelay;
    access_log off;
    expires 30d;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}

# API: api.altivoxai.com
server {
  listen 443 ssl http2;
  server_name api.altivoxai.com;

  ssl_certificate /etc/letsencrypt/live/altivoxai.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/altivoxai.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # Stock CSV/text imports may be up to 2 MB. Larger media bodies are allowed only below.
  client_max_body_size 3m;
  client_header_timeout 10s;
  client_body_timeout 15s;
  keepalive_timeout 15s;
  keepalive_requests 200;
  send_timeout 30s;
  reset_timedout_connection on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Auth endpoints get a tight nginx bucket in addition to Nest's 3-10 request limits.
  location ^~ /api/v1/auth/ {
    limit_req zone=altivox_auth burst=10 nodelay;
    limit_conn altivox_conn 10;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
  }

  # Product media is the only API route allowed to receive a large body.
  location = /api/v1/products/upload-image {
    client_max_body_size 21m;
    client_body_timeout 60s;
    limit_req zone=altivox_upload burst=5 nodelay;
    limit_conn altivox_conn 5;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
  }

  location = /api/v1/admin-template/upload-media {
    client_max_body_size 21m;
    client_body_timeout 60s;
    limit_req zone=altivox_upload burst=5 nodelay;
    limit_conn altivox_conn 5;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
  }

  location = /api/v1/system/announcement/image {
    client_max_body_size 6m;
    client_body_timeout 45s;
    limit_req zone=altivox_upload burst=5 nodelay;
    limit_conn altivox_conn 5;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
  location = /api/v1/broadcasts/upload-image {
    client_max_body_size 6m;
    client_body_timeout 45s;
    limit_req zone=altivox_upload burst=5 nodelay;
    limit_conn altivox_conn 5;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Signed provider callbacks may legitimately arrive in bursts, but are no longer unlimited.
  location ^~ /api/v1/webhooks/ {
    client_max_body_size 2m;
    limit_req zone=altivox_webhook burst=100 nodelay;
    limit_conn altivox_conn 40;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 90s;
  }

  # The local worker shares one source IP, so this bucket is deliberately high but finite.
  location ^~ /api/v1/internal/ {
    client_max_body_size 5m;
    limit_req zone=altivox_internal burst=200 nodelay;
    limit_conn altivox_conn 80;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    alias /opt/reseller-platform/uploads/;
    limit_req zone=altivox_web burst=60 nodelay;
    access_log off;
    expires 30d;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    limit_req zone=altivox_api burst=40 nodelay;
    limit_conn altivox_conn 25;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 90s;
  }
}
